name: Maven Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Set up Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Build application using Maven
      - name: Build with Maven
        run: ./mvnw clean package

      # 4. Run SonarCloud analysis
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.organization=pratap4004 -Dsonar.projectKey=Pratap4004_BoardgameListingWebApp

      # 5. Authenticate to Google Cloud using Workload Identity Federation
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # 6. Set up Google Cloud CLI
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      # 7. Configure Docker to authenticate with Artifact Registry
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      # 8. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t asia-south1-docker.pkg.dev/project-e4b58c33-b31e-44d9-a36/boardgame-repo/boardgame-app:latest \
            .

      # 9. Push Docker image to Artifact Registry
      - name: Push Docker image to Artifact Registry
        run: |
          docker push \
            asia-south1-docker.pkg.dev/project-e4b58c33-b31e-44d9-a36/boardgame-repo/boardgame-app:latest
